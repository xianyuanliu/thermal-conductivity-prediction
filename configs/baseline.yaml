# Evaluation mode: single (fixed 80/20 split), random (shuffled 10-fold),
# or v2 (leave-one-V2-out 10-fold, the extrapolation test).
evaluation: random

# Where to write metrics. Omit to run without saving. For CV, per-fold metrics
# are written next to this with a _folds suffix (results_v2_folds.csv).
results: results_random.csv

# Models to run, each with hyperparameter overrides. An empty {} uses the
# built-in defaults from build_model; any key listed here overrides them.
models:
  linear: {}
  ridge: {alpha: 1.0}
  lasso: {alpha: 1.0e-6}
  svr: {C: 100.0, epsilon: 0.001}
  rf: {n_estimators: 600, max_depth: 20, max_features: sqrt}
  xgb: {n_estimators: 500, learning_rate: 0.05, max_depth: 6}
  mlp: {hidden_layer_sizes: [128, 128], learning_rate_init: 0.003, max_iter: 2000}
